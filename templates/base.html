<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}會員系統{% endblock %}</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: system-ui, "Noto Sans TC", sans-serif; background: #f3f4f6; margin: 0; color: #1f2937; }
    nav { background: #1f2937; padding: 12px 24px; display: flex; gap: 16px; align-items: center; }
    nav a, nav button { color: #fff; text-decoration: none; background: none; border: 0; font-size: 15px; cursor: pointer; padding: 0; }
    nav .spacer { flex: 1; }
    nav .user { color: #9ca3af; font-size: 14px; }
    main { max-width: 420px; margin: 48px auto; background: #fff; padding: 32px; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,.08); }
    h1 { margin-top: 0; font-size: 24px; }
    .field { margin-bottom: 16px; }
    label { display: block; margin-bottom: 6px; font-size: 14px; font-weight: 600; }
    input { width: 100%; padding: 10px 12px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 15px; }
    .btn { width: 100%; padding: 11px; background: #2563eb; color: #fff; border: 0; border-radius: 8px; font-size: 16px; cursor: pointer; }
    .btn:hover { background: #1d4ed8; }
    .errorlist { color: #dc2626; font-size: 13px; padding: 0; margin: 6px 0 0; list-style: none; }
    .helptext { color: #6b7280; font-size: 12px; margin-top: 4px; }
    .helptext ul { padding-left: 18px; margin: 4px 0 0; }
    .msg { padding: 10px 14px; border-radius: 8px; margin-bottom: 16px; font-size: 14px; background: #dbeafe; color: #1e40af; }
    .msg.success { background: #dcfce7; color: #166534; }
    .msg.error { background: #fee2e2; color: #991b1b; }
    .alt { text-align: center; margin-top: 16px; font-size: 14px; }
    .alt a { color: #2563eb; }
  </style>
</head>
<body>
  <nav>
    <a href="{% url 'accounts:home' %}"><strong>首頁</strong></a>
    <span class="spacer"></span>
    {% if user.is_authenticated %}
      <span class="user">{{ user.username }}</span>
      <a href="{% url 'accounts:password_change' %}">修改密碼</a>
      <form method="post" action="{% url 'accounts:logout' %}" style="margin:0">
        {% csrf_token %}
        <button type="submit">登出</button>
      </form>
    {% else %}
      <a href="{% url 'accounts:login' %}">登入</a>
      <a href="{% url 'accounts:register' %}">註冊</a>
    {% endif %}
  </nav>

  <main>
    {% for message in messages %}
      <div class="msg {{ message.tags }}">{{ message }}</div>
    {% endfor %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
