{% extends "base.html" %}
{% block title %}註冊{% endblock %}
{% block content %}
  <h1>註冊</h1>
  <form method="post" novalidate>
    {% csrf_token %}
    {% for field in form %}
      <div class="field">
        <label for="{{ field.id_for_label }}">{{ field.label }}</label>
        {{ field }}
        {{ field.errors }}
        {% if field.help_text %}<div class="helptext">{{ field.help_text|safe }}</div>{% endif %}
      </div>
    {% endfor %}
    <button class="btn" type="submit">建立帳號</button>
  </form>
  <p class="alt">已經有帳號？<a href="{% url 'accounts:login' %}">前往登入</a></p>
{% endblock %}
