{% extends "base.html" %}
{% block title %}登出{% endblock %}
{% block content %}
  <h1>登出</h1>
  {% if user.is_authenticated %}
    <p>確定要登出 <strong>{{ user.username }}</strong> 嗎？</p>
    <form method="post">
      {% csrf_token %}
      <button class="btn" type="submit">確認登出</button>
    </form>
  {% else %}
    <p>你已登出，期待再次見到你！</p>
    <p class="alt"><a href="{% url 'accounts:login' %}">重新登入</a></p>
  {% endif %}
{% endblock %}
